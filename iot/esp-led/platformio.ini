; LED bicolore de l'authentification back-office — RESILIENCE-ALPHA G9 (consigne additionnelle 1)
; Ouvrir ce dossier dans CLion (plugin PlatformIO) ou : pio run -e esp32dev -t upload
; La consigne demande un ESP8266 ; le matériel disponible est un ESP32 : même firmware, deux cibles.
[platformio]
default_envs = esp32dev

[env]
framework = arduino
monitor_speed = 115200
lib_deps = bblanchon/ArduinoJson@^7.4.1
build_flags = -DLED_POLL_MS=500

[env:esp32dev]
platform = espressif32
board = esp32dev
build_flags = ${env.build_flags} -DGREEN_PIN=26 -DRED_PIN=25 -DSTATUS_PIN=2   ; GPIO 2 = LED bleue intégrée (miroir, test sans câblage)

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
build_flags = ${env.build_flags} -DGREEN_PIN=14 -DRED_PIN=12   ; D5 / D6
