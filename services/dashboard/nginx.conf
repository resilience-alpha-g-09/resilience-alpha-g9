# Le dashboard ne parle au remédiateur qu'en lecture : /bff/* → remediator:8000 (GET uniquement).
# Assistant RAG : seulement POST /assistant/ask et GET /assistant/health, débit limité (le dashboard est visible sur le hotspot).
limit_req_zone $binary_remote_addr zone=assistant:1m rate=6r/m;

server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Derrière l'edge, l'app est servie sous /supervision/ ; en accès direct (:3000) la racine redirige vers le même chemin.
    location = / { return 302 /supervision/; }
    location = /supervision/ { try_files /index.html =404; }          # coquille de l'app (évite la boucle / ↔ /supervision/)
    location /supervision/ { rewrite ^/supervision/(.*)$ /$1 last; }  # assets, cockpit.html, routes SPA
    location / { try_files $uri /index.html; }

    # Accès back-office en lecture seule (LED, journal des identifications) : /supervision/bo/* → backoffice /admin/api/*
    location /bo/ {
        limit_except GET { deny all; }
        set $backoffice http://backoffice:8000;
        rewrite ^/bo/(.*)$ /admin/api/$1 break;
        proxy_pass $backoffice;
        proxy_read_timeout 5s;
        add_header Cache-Control "no-store";
    }

    location /bff/ {
        limit_except GET { deny all; }
        set $remediator http://remediator:8000;
        rewrite ^/bff/(.*)$ /$1 break;
        proxy_pass $remediator;
        proxy_read_timeout 5s;
        add_header Cache-Control "no-store";
    }

    # Résolu à la requête : le dashboard démarre même si l'assistant (profil ai) ne tourne pas → 502 côté UI.
    location = /assistant/ask {
        limit_except POST { deny all; }
        limit_req zone=assistant burst=3 nodelay;
        limit_req_status 429;
        client_max_body_size 4k;
        set $assistant http://assistant:8000;
        proxy_pass $assistant/ask;
        proxy_read_timeout 90s;
        add_header Cache-Control "no-store";
    }

    location = /assistant/health {
        limit_except GET { deny all; }
        set $assistant http://assistant:8000;
        proxy_pass $assistant/health;
        proxy_read_timeout 5s;
        add_header Cache-Control "no-store";
    }

    # /reindex et le reste de l'assistant ne sont pas joignables depuis le dashboard
    location /assistant/ { return 404; }
}
