# Exclusions CRS appliquées AVANT les règles (REQUEST-900-EXCLUSION-RULES-BEFORE-CRS).
# Images de la webcam (JSON base64) envoyées au back-office : les chaînes base64 font des faux positifs
# sur les regex RCE/XSS/PHP. On retire UNIQUEMENT l'argument image(s) de l'inspection, sur ces trois routes.
# Le reste de la requête (en-têtes, cookies, autres arguments) et toutes les autres routes restent inspectés.
SecRule REQUEST_URI "@rx ^/admin/api/(login/frame|bootstrap/enroll-images|operators/[^/]+/enroll-images)$" \
    "id:10010,phase:1,pass,t:none,nolog,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:image,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.image,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:images,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.images"

# Le laboratoire s'adresse par IP (192.168.137.1, localhost) : la règle « Host header is a numeric IP » ajouterait 3 points
# à chaque requête et ferait basculer des requêtes légitimes au-delà du seuil (5). Désactivée pour tout le site.
SecRule REQUEST_URI "@unconditionalMatch" "id:10001,phase:1,pass,t:none,nolog,ctl:ruleRemoveById=920350"

# Outils internes en lecture (Grafana, supervision) : leurs pages HTML/JS déclenchent des faux positifs en sortie
# (953100 « PHP information leakage » sur le bootstrap Grafana → 403 en phase 4, panneaux vides).
# Les règles de fuite d'information en sortie (tag attack-disclosure, 95x) sont retirées pour ces deux préfixes ;
# tout le reste (règles entrantes, autres routes) reste inspecté. (libmodsecurity v3 : pas de ctl:responseBodyAccess.)
SecRule REQUEST_URI "@rx ^/(grafana|supervision)/" "id:10020,phase:1,pass,t:none,nolog,ctl:ruleRemoveByTag=attack-disclosure"
