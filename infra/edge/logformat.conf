# Inclus au niveau http par l'image CRS (conf.d/*.conf). Format JSON → Loki (| json).
log_format json_combined escape=json
  '{"ts":"$time_iso8601","client_ip":"$remote_addr","method":"$request_method","uri":"$uri",'
  '"status":$status,"bytes":$body_bytes_sent,"rt":$request_time,"upstream":"$upstream_addr",'
  '"urt":"$upstream_response_time","ua":"$http_user_agent","xff":"$http_x_forwarded_for"}';

# Limitation de débit sur la connexion au back-office (consigne additionnelle 1)
limit_req_zone $binary_remote_addr zone=bo_login:1m rate=10r/m;

# Étranglement piloté par le remédiateur : les adresses listées dans throttle.conf (geo) sont limitées à 6 req/min
# sur /api/ et /auth/. Utilisé quand la source est une passerelle NAT partagée (Docker Desktop : 192.168.65.1) —
# la bloquer couperait aussi les clients légitimes derrière le même NAT. Rechargé par SIGHUP comme la blocklist.
geo $ra_throttled { default 0; include /etc/nginx/blocklist/throttle.conf; }
map $ra_throttled $ra_throttle_key { 1 $binary_remote_addr; default ""; }
limit_req_zone $ra_throttle_key zone=ra_throttle:1m rate=6r/m;
