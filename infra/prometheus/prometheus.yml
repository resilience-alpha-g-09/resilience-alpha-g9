global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
  - job_name: api
    static_configs: [{ targets: ["api:8000"] }]
  - job_name: auth
    static_configs: [{ targets: ["auth:8000"] }]
  - job_name: remediator
    static_configs: [{ targets: ["remediator:8000"] }]
  - job_name: detector
    static_configs: [{ targets: ["detector:8000"] }]
  - job_name: simulator
    static_configs: [{ targets: ["simulator:9100"] }]
  - job_name: cadvisor
    static_configs: [{ targets: ["cadvisor:8080"] }]
    metric_relabel_configs:
      # ne garder que nos conteneurs (label name = container_name ra-*)
      - source_labels: [__name__, name]
        regex: "container_(cpu_usage_seconds_total|memory_working_set_bytes|network_receive_bytes_total|last_seen);ra-.*"
        action: keep
