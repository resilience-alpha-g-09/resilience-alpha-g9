name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Compilation Python
        run: python -m py_compile services/*/app/main.py services/*/main.py ml/*.py attack/*.py tests/*.py

      - name: Validation docker-compose
        run: cp .env.example .env && docker compose config -q

      - name: Secrets en clair (gitleaks)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 detect --source /repo --no-banner --redact

      - name: Build des images
        run: docker compose build api auth remediator detector simulator front dashboard assistant backoffice

  e2e:
    # La boucle de reprise complète : paiement → stop api → reprise autonome → paiement
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Démarrer la plateforme
        run: |
          cp .env.example .env
          AGENT_URL=http://mockagent:8090 docker compose --profile mockagent up -d --build --scale cadvisor=0
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1/healthz >/dev/null 2>&1 && curl -fsS http://127.0.0.1:3000/bff/health >/dev/null 2>&1 && break
            sleep 5
          done
      - name: Tests d'intégration
        run: pip install -q -r tests/requirements.txt && python -m pytest tests/ -q
      - name: Boucle de reprise autonome
        run: ./tests/e2e_loop.sh
      - name: Logs en cas d'échec
        if: failure()
        run: docker compose ps && docker compose logs --tail=80 edge api auth remediator
